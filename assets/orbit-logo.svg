<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <defs>
        <!-- Background Gradient -->
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
            <stop offset="0%" stop-color="#141d30" />
            <stop offset="60%" stop-color="#0a0e17" />
            <stop offset="100%" stop-color="#06090e" />
        </radialGradient>

        <!-- Orbit Ring Gradient 1 (Cyan to Violet) -->
        <linearGradient id="orbitGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#c084fc" />
        </linearGradient>

        <!-- Orbit Ring Gradient 2 (Violet to Cyan backlight) -->
        <linearGradient id="orbitGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.85" />
            <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.5" />
            <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
        </linearGradient>

        <!-- Terminal Glyph Gradient -->
        <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f8fafc" />
            <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>

        <!-- Neon Ambient Glow Filters -->
        <filter id="neonGlowCyan" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="12" result="blur1" />
            <feMerge>
                <feMergeNode in="blur1" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- App Squircle Frame -->
    <rect width="512" height="512" rx="112" fill="url(#bgGlow)" stroke="#1e293b" stroke-width="6" />

    <!-- Outer Ambient Orbital Glow Halo -->
    <circle cx="256" cy="256" r="148" fill="none" stroke="#38bdf8" stroke-width="24" opacity="0.08" filter="url(#neonGlowCyan)" />

    <!-- Secondary Counter-Orbit Track (Behind) -->
    <ellipse cx="256" cy="256" rx="176" ry="74" fill="none" stroke="url(#orbitGrad2)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 12 340 12" transform="rotate(-32 256 256)" opacity="0.75" />

    <!-- Main Orbit Planetary Ring (Tilted ellipse) -->
    <ellipse cx="256" cy="256" rx="168" ry="70" fill="none" stroke="url(#orbitGrad1)" stroke-width="15" stroke-linecap="round" transform="rotate(35 256 256)" filter="url(#neonGlowCyan)" />

    <!-- Orbit Satellite Node (Glowing orb along the ring) -->
    <circle cx="372" cy="174" r="11" fill="#e0f2fe" filter="url(#subtleGlow)" />
    <circle cx="372" cy="174" r="5" fill="#38bdf8" />

    <!-- Central Terminal Prompt Glyphs ( > _ ) -->
    <g filter="url(#subtleGlow)">
        <!-- Terminal Chevron '>' -->
        <path d="M 210 196 L 268 256 L 210 316" fill="none" stroke="url(#glyphGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Terminal Cursor Underscore '_' -->
        <line x1="284" y1="316" x2="330" y2="316" stroke="url(#glyphGrad)" stroke-width="24" stroke-linecap="round" />
    </g>
</svg>
