<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="xterm.css">
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none !important;
            -webkit-user-select: none !important;
            user-select: none !important;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #0d1117;
            overflow: hidden;
            touch-action: none !important;
            overscroll-behavior: none !important;
        }
        #terminal-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            padding: 2px 4px;
            touch-action: none !important;
            overscroll-behavior: none !important;
        }
        .xterm {
            height: 100%;
            width: 100%;
            touch-action: none !important;
        }
        .xterm .xterm-viewport {
            overflow-y: auto !important;
            -webkit-overflow-scrolling: auto;
            will-change: scroll-position;
            touch-action: none !important;
            overscroll-behavior: none !important;
        }
        .xterm .xterm-screen, .xterm canvas, .xterm-scroll-area {
            touch-action: none !important;
        }
        /* Style high-contrast scrollbar */
        .xterm .xterm-viewport::-webkit-scrollbar {
            width: 4px;
        }
        .xterm .xterm-viewport::-webkit-scrollbar-thumb {
            background-color: rgba(255, 255, 255, 0.25);
            border-radius: 4px;
        }
        .xterm-cursor-layer {
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>
    <script>
        console.log("Initializing xterm.js in Android WebView...");

        window._pending = [];
        window._userIsAtBottom = true;
        window._termReady = false;
        window._fitted = false;

        window.writeRawBase64 = function(base64) {
            if (!window._termReady || !window._fitted) {
                window._pending.push(base64);
                return;
            }
            try {
                const binaryString = atob(base64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                term.write(bytes, () => {
                    // Auto-scroll as streaming output comes in ONLY if user is not actively touching, no momentum active, and is at bottom
                    if (!isTouching && !momentumAnimId && window._userIsAtBottom) {
                        term.scrollToBottom();
                    }
                });
            } catch (e) {
                console.error("Error writing to term:", e);
            }
        };

        const term = new Terminal({
            theme: {
                background: '#0d1117',
                foreground: '#c9d1d9',
                cursor: '#58a6ff',
                cursorAccent: '#0d1117',
                selectionBackground: '#264f78',
                black: '#484f58',
                red: '#ff7b72',
                green: '#3fb950',
                yellow: '#d29922',
                blue: '#58a6ff',
                magenta: '#bc8cff',
                cyan: '#39c5cf',
                white: '#b1bac4',
                brightBlack: '#6e7681',
                brightRed: '#ffa198',
                brightGreen: '#56d364',
                brightYellow: '#e3b341',
                brightBlue: '#79c0ff',
                brightMagenta: '#d2a8ff',
                brightCyan: '#56d4dd',
                brightWhite: '#f0f6fc'
            },
            fontFamily: "monospace",
            fontSize: 9.5,
            lineHeight: 1.1,
            cursorBlink: true,
            cursorStyle: 'block',
            scrollback: 10000,
            disableStdin: true,
            convertEol: true,
            scrollSensitivity: 1,
            fastScrollSensitivity: 4,
            smoothScrollDuration: 0
        });

        // Register custom sequence handlers to consume unhandled queries gracefully
        if (term.parser) {
            term.parser.registerCsiHandler({ prefix: '>', final: 'm' }, () => true);
            term.parser.registerCsiHandler({ prefix: '>', final: 'q' }, () => true);
            term.parser.registerOscHandler(0, () => true);
            term.parser.registerOscHandler(2, () => true);
        }

        let fitAddon = null;
        try {
            const FitClass = (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) ? FitAddon.FitAddon : (typeof FitAddon !== 'undefined' ? FitAddon : null);
            if (FitClass) {
                fitAddon = new FitClass();
                term.loadAddon(fitAddon);
            }
        } catch (e) {
            console.error("FitAddon load error:", e);
        }

        const container = document.getElementById('terminal-container');
        term.open(container);

        let viewportElement = null;
        function getViewport() {
            if (!viewportElement) {
                viewportElement = container.querySelector('.xterm-viewport');
            }
            return viewportElement;
        }

        // Track whether user is at bottom or has scrolled up
        function checkScrollPosition() {
            try {
                const vp = getViewport();
                if (vp) {
                    const maxScroll = vp.scrollHeight - vp.clientHeight;
                    window._userIsAtBottom = (vp.scrollTop >= maxScroll - 4);
                } else if (term.buffer && term.buffer.active) {
                    const buf = term.buffer.active;
                    window._userIsAtBottom = (buf.viewportY >= buf.baseY);
                }
            } catch (e) {}
        }
        term.onScroll(checkScrollPosition);

        // ==========================================
        // SUB-PIXEL CONTINUOUS KINETIC TOUCH SCROLLING
        // ==========================================
        let isTouching = false;
        let startTouchY = 0;
        let startTouchTime = 0;
        let lastTouchY = 0;
        let totalMoved = 0;
        let touchSamples = []; // Array of { t, y }
        let momentumAnimId = null;
        let currentVelocity = 0; // px/ms

        container.addEventListener('touchstart', function(e) {
            if (e.touches.length === 1) {
                isTouching = true;
                const now = performance.now();
                startTouchY = e.touches[0].clientY;
                startTouchTime = now;
                lastTouchY = startTouchY;
                totalMoved = 0;

                // Stop active momentum animation instantly on contact
                if (momentumAnimId) {
                    cancelAnimationFrame(momentumAnimId);
                    momentumAnimId = null;
                }
                currentVelocity = 0;

                touchSamples = [{ t: now, y: startTouchY }];
            }
            if (e.cancelable) {
                e.preventDefault();
            }
        }, { capture: true, passive: false });

        container.addEventListener('touchmove', function(e) {
            if (!isTouching || e.touches.length !== 1) return;

            const now = performance.now();
            const currentY = e.touches[0].clientY;
            const deltaY = lastTouchY - currentY; // positive = drag up (scroll down); negative = drag down (scroll up)
            lastTouchY = currentY;

            totalMoved += Math.abs(deltaY);

            // Record touch sample for rolling velocity window
            touchSamples.push({ t: now, y: currentY });
            const cutoff = now - 120;
            while (touchSamples.length > 2 && touchSamples[0].t < cutoff) {
                touchSamples.shift();
            }

            // Stop xterm's internal conflicting touch handler
            e.stopPropagation();

            if (deltaY < 0) {
                window._userIsAtBottom = false;
            }

            // Direct 1:1 responsive sub-pixel scrolling
            const vp = getViewport();
            if (vp) {
                vp.scrollTop += deltaY;
            }
            checkScrollPosition();

            if (e.cancelable) {
                e.preventDefault();
            }
        }, { capture: true, passive: false });

        container.addEventListener('touchend', function(e) {
            if (!isTouching) return;
            isTouching = false;

            const now = performance.now();
            const touchDuration = now - startTouchTime;

            // Compute true fling velocity over the release window (~65ms)
            let flingVelocity = 0; // px/ms
            if (touchSamples.length >= 2) {
                const recentCutoff = now - 65;
                let sampleStart = touchSamples[0];
                for (let i = touchSamples.length - 1; i >= 0; i--) {
                    if (touchSamples[i].t <= recentCutoff) {
                        sampleStart = touchSamples[i];
                        break;
                    }
                }
                const sampleEnd = touchSamples[touchSamples.length - 1];
                const dt = sampleEnd.t - sampleStart.t;
                if (dt >= 8) {
                    flingVelocity = (sampleStart.y - sampleEnd.y) / dt;
                }
            }

            const isFlick = Math.abs(flingVelocity) > 0.08;

            // Detect tap ONLY if movement is tiny (< 8px), duration is short (< 250ms), and user didn't flick
            if (totalMoved < 8 && !isFlick && touchDuration < 250) {
                if (window.AndroidBridge && window.AndroidBridge.onTerminalClicked) {
                    window.AndroidBridge.onTerminalClicked();
                }
                return;
            }

            // Fluid kinetic fling momentum
            if (isFlick) {
                const vp = getViewport();
                if (!vp) return;

                // 1.15x impulse multiplier for effortless, fluid glides on short flicks
                currentVelocity = flingVelocity * 1.15;

                let lastAnimTime = performance.now();
                const friction = 0.972; // Smooth, natural deceleration

                function momentumStep(animNow) {
                    const dt = Math.min(32, Math.max(1, animNow - lastAnimTime));
                    lastAnimTime = animNow;

                    vp.scrollTop += currentVelocity * dt;
                    checkScrollPosition();

                    // If we hit the boundary, halt momentum cleanly
                    const maxScroll = vp.scrollHeight - vp.clientHeight;
                    if ((currentVelocity < 0 && vp.scrollTop <= 0) || 
                        (currentVelocity > 0 && vp.scrollTop >= maxScroll - 1)) {
                        momentumAnimId = null;
                        currentVelocity = 0;
                        checkScrollPosition();
                        return;
                    }

                    // Frame-rate independent decay (works identical at 60Hz, 90Hz, 120Hz)
                    const frameDecay = Math.pow(friction, dt / 16.67);
                    currentVelocity *= frameDecay;

                    if (Math.abs(currentVelocity) > 0.02) {
                        momentumAnimId = requestAnimationFrame(momentumStep);
                    } else {
                        momentumAnimId = null;
                        currentVelocity = 0;
                        checkScrollPosition();
                    }
                }
                momentumAnimId = requestAnimationFrame(momentumStep);
            } else {
                checkScrollPosition();
            }
        }, { capture: true, passive: true });

        let lastStableRows = 30;
        let lastStableCols = 68;

        function fitTerminal() {
            try {
                if (fitAddon) {
                    fitAddon.fit();
                }

                // If height shrank drastically (soft keyboard opened), do not crush PTY rows
                const isKeyboardOpen = (lastStableRows > 0 && term.rows < lastStableRows * 0.7);

                if (isKeyboardOpen) {
                    term.scrollToBottom();
                    return;
                }

                // Legitimate resize (orientation change, initial load, or keyboard closed)
                if (term.cols >= 20 && term.rows >= 10) {
                    lastStableCols = term.cols;
                    lastStableRows = term.rows;

                    if (window.AndroidBridge && window.AndroidBridge.onResize) {
                        window.AndroidBridge.onResize(term.cols, term.rows);
                    }
                }

                window._fitted = true;
                if (!window._termReady) {
                    window._termReady = true;
                    // Drain any pending data
                    if (window._pending && window._pending.length > 0) {
                        for (const b of window._pending) {
                            window.writeRawBase64(b);
                        }
                        window._pending = [];
                    }
                }
            } catch (e) {
                console.error("Fit error:", e);
            }
        }

        // Fit immediately and schedule micro-checks for layout settling
        fitTerminal();
        requestAnimationFrame(fitTerminal);
        setTimeout(fitTerminal, 80);
        setTimeout(fitTerminal, 250);
        window.addEventListener('resize', fitTerminal);

        function setFontSize(newSize) {
            term.options.fontSize = newSize;
            fitTerminal();
        }

        function clearTerminal() {
            term.clear();
        }

        window.scrollToBottom = function() {
            window._userIsAtBottom = true;
            if (momentumAnimId) {
                cancelAnimationFrame(momentumAnimId);
                momentumAnimId = null;
            }
            currentVelocity = 0;
            term.scrollToBottom();
        };
    </script>
</body>
</html>
