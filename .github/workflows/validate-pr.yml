name: Validate PR (Issue & Documentation)

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]

permissions:
  pull-requests: write
  issues: read
  contents: read

jobs:
  validate:
    name: Validate PR (Issue & Documentation)
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR Description & Linked Issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';
            const prNumber = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const errors = [];

            // 1. Validar que la descripcion no este vacia
            if (!body.trim()) {
              errors.push("La descripcion del Pull Request esta completamente vacia.");
            }

            // 2. Validar que no se haya dejado el placeholder por defecto sin rellenar
            if (body.includes("Closes # (") || body.includes("Closes # (issue") || /Closes\s*#\s*$/im.test(body)) {
              errors.push("No has especificado el numero de issue en la plantilla (`Closes # <numero>`).");
            }

            // 3. Buscar patrones de vinculacion de issues (Closes #123, Fixes #123, Resolves #123, Refs #123)
            const issueRegex = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?|issue:?)\s+(?:https?:\/\/github\.com\/[^\/]+\/[^\/]+\/issues\/|#)(\d+)/gi;
            const matches = [...body.matchAll(issueRegex)];

            if (matches.length === 0) {
              errors.push("No se encontro ningun issue vinculado. Debes incluir una referencia como `Closes #<numero>`, `Fixes #<numero>` o `Refs #<numero>`.");
            } else {
              // Validar que cada issue referenciado realmente exista y sea un issue (no otro PR)
              for (const match of matches) {
                const issueNum = parseInt(match[1], 10);
                try {
                  const issue = await github.rest.issues.get({
                    owner,
                    repo,
                    issue_number: issueNum,
                  });
                  if (issue.data.pull_request) {
                    errors.push(`El numero #${issueNum} corresponde a otro Pull Request, no a un Issue.`);
                  }
                } catch (err) {
                  if (err.status === 404) {
                    errors.push(`El Issue #${issueNum} no existe en el repositorio ${owner}/${repo}.`);
                  } else {
                    core.warning(`No se pudo verificar el issue #${issueNum}: ${err.message}`);
                  }
                }
              }
            }

            // 4. Validar contenido descriptivo minimo (excluyendo comentarios y checkboxes)
            const cleanBody = body
              .replace(/<!--[\s\S]*?-->/g, '')
              .replace(/##[^\n]*/g, '')
              .replace(/- \[[ xX]\][^\n]*/g, '')
              .trim();

            if (cleanBody.length < 20) {
              errors.push("La descripcion del cambio es demasiado corta. Explica brevemente que se modifico y por que.");
            }

            // 5. Manejar reporte de errores o exito
            const botSignature = "<!-- pr-validation-comment -->";
            if (errors.length > 0) {
              const commentBody = `### ❌ Validacion de Pull Request Fallida\n\n` +
                `Este repositorio requiere que todos los PRs esten vinculados a un **Issue** existente y cuenten con documentacion del cambio antes de ser fusionados.\n\n` +
                `**Problemas detectados:**\n` +
                errors.map(e => `- ${e}`).join("\n") +
                `\n\n---\n*💡 Por favor edita la descripcion de este Pull Request para resolver los puntos anteriores. Al guardarla, esta comprobacion se volvera a ejecutar automaticamente.*` +
                `\n\n${botSignature}`;

              try {
                const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
                const existing = comments.data.find(c => c.body && c.body.includes(botSignature));
                if (existing) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body: commentBody });
                }
              } catch (commentErr) {
                core.warning(`No se pudo publicar el comentario en el PR: ${commentErr.message}`);
              }

              core.setFailed("La validacion del Pull Request ha fallado:\n" + errors.join("\n"));
            } else {
              core.info("✅ Pull Request validado exitosamente: Issue vinculado y descripcion completa.");
              try {
                const comments = await github.rest.issues.listComments({ owner, repo, issue_number: prNumber });
                const existing = comments.data.find(c => c.body && c.body.includes(botSignature));
                if (existing) {
                  await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
                }
              } catch (commentErr) {
                // Silencioso si no se puede borrar el comentario
              }
            }